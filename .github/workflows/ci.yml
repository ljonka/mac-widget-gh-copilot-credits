name: macOS tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: bash -n scripts/install.sh scripts/uninstall.sh
      - name: Test
        run: swift test
      - name: Build release
        run: swift build -c release
